<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADLSM · Equipos</title><link rel="icon" href="../assets/logos/ADLSM.jpg"><link rel="stylesheet" href="app.css"></head><body class="app-page"><div class="app-layout"><aside class="app-sidebar"><a class="app-brand" href="./"><img src="../assets/logos/ADLSM.jpg" alt="ADLSM"><span>ADLSM</span></a><nav><div class="nav-group">GESTIÓN</div><a href="./">Panel</a><a class="active" href="./equipos.html">Equipos</a><a href="./personas.html">Personas</a><a href="./temporadas.html">Temporadas</a><a href="./partidos.html">Partidos</a></nav><div class="sidebar-footer"><a href="../horarios/">Horarios FAB</a><a href="../resultados/">Resultados FEB/FAB</a><button id="logout" class="ghost-button">Cerrar sesión</button></div></aside><main class="app-main"><header class="app-header"><div><span class="eyebrow">GESTIÓN · ESTRUCTURA</span><h1 id="page-title">Equipos</h1></div><div class="user-chip"><span id="user-name"></span><span id="user-roles"></span></div></header><section id="teamPanel" class="data-panel" hidden><div class="section-heading"><div><span class="eyebrow">CATÁLOGO</span><h2>Crear equipo base</h2></div></div><form id="teamForm"><div class="form-grid"><label class="field">Nombre<input id="teamName" required placeholder="Ej.: La Salle Montemolín"></label><label class="field">Categoría<input id="teamCategory" required placeholder="Ej.: Senior"></label><label class="field">Género<select id="teamGender"><option value="Masculino">Masculino</option><option value="Femenino">Femenino</option><option value="Mixto">Mixto</option></select></label><label class="field">Notas<input id="teamNotes"></label></div><div class="form-actions"><button class="primary" type="submit">Crear equipo</button></div><div id="teamMessage"></div></form></section><section id="seasonTeamPanel" class="data-panel" hidden><div class="section-heading"><div><span class="eyebrow">TEMPORADA</span><h2>Vincular equipo a temporada</h2></div></div><form id="seasonTeamForm"><div class="form-grid"><label class="field">Equipo<select id="teamSelect" required></select></label><label class="field">Temporada<select id="seasonSelect" required></select></label><label class="field">Nombre visible<input id="displayName" placeholder="Se genera automáticamente si se deja vacío"></label><label class="field">Categoría<input id="seasonCategory" placeholder="Ej.: Junior"></label><label class="field">Nivel<input id="level" placeholder="Ej.: Federado"></label><label class="field">Género<select id="seasonGender"><option value="">Usar el del equipo</option><option value="Masculino">Masculino</option><option value="Femenino">Femenino</option><option value="Mixto">Mixto</option></select></label><label class="field">Sección<select id="section" required><option value="">Seleccionar…</option><option value="Escolar masculina">Escolar masculina</option><option value="Escolar femenina">Escolar femenina</option><option value="Escuela">Escuela</option><option value="Federados">Federados</option></select></label><label class="field">Competición<input id="competition"></label><label class="field">Grupo<input id="group"></label><label class="field">Pabellón<input id="venue"></label><label class="field">Dirección<input id="address"></label></div><div class="form-actions"><button class="primary" type="submit">Vincular a temporada</button></div><div id="seasonTeamMessage"></div></form></section><section class="data-panel"><div class="section-heading"><div><span class="eyebrow">TEMPORADAS</span><h2>Equipos dentro de temporada</h2></div><span id="count" class="status-pill"></span></div><div id="content">Cargando…</div></section></main></div><script type="module">import{requireContext,query,insert,remove,escapeHtml,enableLogout,setHeader,canEditAll,canEditSection,showMessage}from'./data.js';const c=await requireContext();setHeader(c,'Equipos');enableLogout();if(canEditAll(c))document.querySelector('#teamPanel').hidden=false;if(canEditSection(c))document.querySelector('#seasonTeamPanel').hidden=false;let teams=[],seasons=[];async function loadOptions(){teams=await query('teams','id,name,category,gender,is_active');seasons=await query('seasons','id,name,start_year,end_year,is_active');document.querySelector('#teamSelect').innerHTML=teams.filter(t=>t.is_active).map(t=>`<option value="${t.id}" data-category="${escapeHtml(t.category||'')}" data-gender="${escapeHtml(t.gender||'')}">${escapeHtml(t.name)}</option>`).join('');document.querySelector('#seasonSelect').innerHTML=seasons.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');const first=document.querySelector('#teamSelect option');if(first){document.querySelector('#seasonCategory').value=first.dataset.category||'';document.querySelector('#seasonGender').value='';}}document.querySelector('#teamSelect').onchange=()=>{const o=document.querySelector('#teamSelect option:checked');document.querySelector('#seasonCategory').value=o?.dataset.category||''};document.querySelector('#teamForm').addEventListener('submit',async e=>{e.preventDefault();try{await insert('teams',{name:teamName.value.trim(),category:teamCategory.value.trim(),gender:teamGender.value,notes:teamNotes.value.trim()||null,is_active:true});showMessage(teamMessage,'Equipo creado correctamente.','success');e.target.reset();await loadOptions();await render()}catch(err){showMessage(teamMessage,err.message,'error')}});document.querySelector('#seasonTeamForm').addEventListener('submit',async e=>{e.preventDefault();try{const team=teams.find(x=>x.id===teamSelect.value);const season=seasons.find(x=>x.id===seasonSelect.value);await insert('team_seasons',{team_id:teamSelect.value,season_id:seasonSelect.value,display_name:displayName.value.trim()||`${team.name} · ${season.name}`,category:seasonCategory.value.trim()||team.category||null,level:level.value.trim()||null,gender:seasonGender.value||team.gender||null,section:section.value,competition_name:competition.value.trim()||null,group_name:group.value.trim()||null,venue_name:venue.value.trim()||null,venue_address:address.value.trim()||null});showMessage(seasonTeamMessage,'Equipo vinculado a la temporada.','success');e.target.reset();await render()}catch(err){showMessage(seasonTeamMessage,err.message,'error')}});async function render(){const rows=await query('team_seasons','id,display_name,category,level,gender,section,season_id,team_id');rows.sort((a,b)=>String(a.display_name).localeCompare(String(b.display_name),'es'));document.querySelector('#count').textContent=`${rows.length} equipos`;document.querySelector('#content').innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>Equipo</th><th>Temporada</th><th>Categoría</th><th>Nivel</th><th>Género</th><th>Sección</th>${canEditAll(c)?'<th></th>':''}</tr></thead><tbody>${rows.map(r=>{const s=seasons.find(x=>x.id===r.season_id);return`<tr><td><strong>${escapeHtml(r.display_name||'Sin nombre')}</strong></td><td>${escapeHtml(s?.name||'—')}</td><td>${escapeHtml(r.category||'—')}</td><td>${escapeHtml(r.level||'—')}</td><td>${escapeHtml(r.gender||'—')}</td><td>${escapeHtml(r.section||'—')}</td>${canEditAll(c)?`<td><button class="secondary" data-delete="${r.id}">Eliminar</button></td>`:''}</tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No hay equipos asociados a temporadas todavía.</div>';document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar esta relación de equipo y temporada? Se eliminarán también sus relaciones dependientes.'))return;try{await remove('team_seasons',b.dataset.delete);await render()}catch(err){alert(err.message)}})}await loadOptions();await render();</script></body></html>
