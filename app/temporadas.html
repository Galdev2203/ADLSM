<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADLSM · Temporadas</title><link rel="icon" href="../assets/logos/ADLSM.jpg"><link rel="stylesheet" href="app.css"></head><body class="app-page"><div class="app-layout"><aside class="app-sidebar"><a class="app-brand" href="./"><img src="../assets/logos/ADLSM.jpg" alt="ADLSM"><span>ADLSM</span></a><nav><a href="./">Panel</a><a href="./equipos.html">Equipos</a><a href="./personas.html">Personas</a><a class="active" href="./temporadas.html">Temporadas</a><a href="./partidos.html">Partidos</a></nav><div class="sidebar-footer"><a href="../horarios/">Horarios FAB</a><a href="../resultados/">Resultados</a><button id="logout" class="ghost-button">Cerrar sesión</button></div></aside><main class="app-main"><header class="app-header"><div><span class="eyebrow">GESTIÓN</span><h1 id="page-title">Temporadas</h1></div><div class="user-chip"><span id="user-name"></span><span id="user-roles"></span></div></header><section class="data-panel"><div class="section-heading"><span class="eyebrow">HISTORIAL</span><h2>Temporadas registradas</h2></div><div id="content">Cargando…</div></section></main></div><script type="module">import{requireContext,query,escapeHtml,enableLogout,setHeader}from'./data.js';const c=await requireContext();setHeader(c,'Temporadas');enableLogout();const rows=await query('seasons','id,name,start_year,end_year,is_active');document.querySelector('#content').innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>Temporada</th><th>Inicio</th><th>Fin</th><th>Estado</th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${escapeHtml(r.name)}</strong></td><td>${r.start_year}</td><td>${r.end_year}</td><td>${r.is_active?'Activa':'Histórica'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No hay temporadas registradas todavía.</p>';</script></body></html>
