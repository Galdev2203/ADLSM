<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADLSM · Temporadas</title><link rel="icon" href="../assets/logos/ADLSM.jpg"><link rel="stylesheet" href="app.css"></head><body class="app-page"><div class="app-layout"><aside class="app-sidebar"><a class="app-brand" href="./"><img src="../assets/logos/ADLSM.jpg" alt="ADLSM"><span>ADLSM</span></a><nav><div class="nav-group">GESTIÓN</div><a href="./">Panel</a><a href="./equipos.html">Equipos</a><a href="./personas.html">Personas</a><a class="active" href="./temporadas.html">Temporadas</a><a href="./partidos.html">Partidos</a></nav><div class="sidebar-footer"><a href="../horarios/">Horarios FAB</a><a href="../resultados/">Resultados FEB/FAB</a><button id="logout" class="ghost-button">Cerrar sesión</button></div></aside><main class="app-main"><header class="app-header"><div><span class="eyebrow">GESTIÓN · ESTRUCTURA</span><h1 id="page-title">Temporadas</h1></div><div class="user-chip"><span id="user-name"></span><span id="user-roles"></span></div></header><section id="createPanel" class="data-panel" hidden><div class="section-heading"><div><span class="eyebrow">COORDINACIÓN</span><h2>Nueva temporada</h2></div></div><form id="seasonForm"><div class="form-grid"><label class="field">Nombre<input id="name" required placeholder="Ej.: 2026/27"></label><label class="field">Año de inicio<input id="startYear" type="number" min="2000" max="2100" required></label><label class="field">Año de fin<input id="endYear" type="number" min="2001" max="2101" required></label><label class="field"><span>Activa</span><select id="active"><option value="false">No</option><option value="true">Sí</option></select></label></div><div class="form-actions"><button class="primary" type="submit">Crear temporada</button></div><div id="formMessage"></div></form></section><section class="data-panel"><div class="section-heading"><div><span class="eyebrow">HISTORIAL</span><h2>Temporadas registradas</h2></div><span id="count" class="status-pill"></span></div><div id="content">Cargando…</div></section></main></div><script type="module">import{requireContext,query,insert,update,remove,escapeHtml,enableLogout,setHeader,canEditAll,showMessage}from'./data.js';const c=await requireContext();setHeader(c,'Temporadas');enableLogout();const createPanel=document.querySelector('#createPanel');if(canEditAll(c))createPanel.hidden=false;const form=document.querySelector('#seasonForm');form.addEventListener('submit',async e=>{e.preventDefault();const msg=document.querySelector('#formMessage');try{const start=Number(document.querySelector('#startYear').value);const end=Number(document.querySelector('#endYear').value);if(end!==start+1)throw new Error('El año de fin debe ser exactamente un año posterior al de inicio.');await insert('seasons',{name:document.querySelector('#name').value.trim(),start_year:start,end_year:end,is_active:document.querySelector('#active').value==='true'});showMessage(msg,'Temporada creada correctamente.','success');form.reset();await render();}catch(err){showMessage(msg,err.message,'error')}});async function render(){const rows=await query('seasons','id,name,start_year,end_year,is_active');rows.sort((a,b)=>b.start_year-a.start_year);document.querySelector('#count').textContent=`${rows.length} temporadas`;document.querySelector('#content').innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>Temporada</th><th>Años</th><th>Estado</th>${canEditAll(c)?'<th></th>':''}</tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${escapeHtml(r.name)}</strong></td><td>${r.start_year} / ${r.end_year}</td><td><span class="status-pill ${r.is_active?'active':''}">${r.is_active?'Activa':'Histórica'}</span></td>${canEditAll(c)?`<td><button class="secondary" data-toggle="${r.id}" data-active="${r.is_active}">${r.is_active?'Desactivar':'Activar'}</button> <button class="secondary" data-delete="${r.id}">Eliminar</button></td>`:''}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay temporadas registradas todavía.</div>';document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{try{await update('seasons',b.dataset.toggle,{is_active:b.dataset.active!=='true'});await render()}catch(err){alert(err.message)}});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar esta temporada? Solo debería hacerse si no tiene datos relacionados.'))return;try{await remove('seasons',b.dataset.delete);await render()}catch(err){alert(err.message)}})}await render();</script></body></html>
