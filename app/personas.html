<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADLSM · Personas</title><link rel="icon" href="../assets/logos/ADLSM.jpg"><link rel="stylesheet" href="app.css"></head><body class="app-page"><div class="app-layout"><aside class="app-sidebar"><a class="app-brand" href="./"><img src="../assets/logos/ADLSM.jpg" alt="ADLSM"><span>ADLSM</span></a><nav><a href="./">Panel</a><a href="./equipos.html">Equipos</a><a class="active" href="./personas.html">Personas</a><a href="./temporadas.html">Temporadas</a><a href="./partidos.html">Partidos</a></nav><div class="sidebar-footer"><a href="../horarios/">Horarios FAB</a><a href="../resultados/">Resultados</a><button id="logout" class="ghost-button">Cerrar sesión</button></div></aside><main class="app-main"><header class="app-header"><div><span class="eyebrow">GESTIÓN</span><h1 id="page-title">Personas</h1></div><div class="user-chip"><span id="user-name"></span><span id="user-roles"></span></div></header><section class="data-panel"><div class="section-heading"><span class="eyebrow">DIRECTORIO</span><h2>Personas</h2></div><div id="content">Cargando…</div></section></main></div><script type="module">import{requireContext,query,escapeHtml,enableLogout,setHeader}from'./data.js';const c=await requireContext();setHeader(c,'Personas');enableLogout();const rows=await query('people','id,first_name,last_name,email,is_active');document.querySelector('#content').innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Email</th><th>Estado</th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${escapeHtml(`${r.first_name} ${r.last_name}`)}</strong></td><td>${escapeHtml(r.email||'—')}</td><td>${r.is_active?'Activa':'Inactiva'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No hay personas registradas todavía.</p>';</script></body></html>
