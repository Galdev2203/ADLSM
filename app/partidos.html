<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADLSM · Partidos</title><link rel="icon" href="../assets/logos/ADLSM.jpg"><link rel="stylesheet" href="app.css"></head><body class="app-page"><div class="app-layout"><aside class="app-sidebar"><a class="app-brand" href="./"><img src="../assets/logos/ADLSM.jpg" alt="ADLSM"><span>ADLSM</span></a><nav><div class="nav-group">GESTIÓN</div><a href="./">Panel</a><a href="./equipos.html">Equipos</a><a href="./personas.html">Personas</a><a href="./temporadas.html">Temporadas</a><a class="active" href="./partidos.html">Partidos</a></nav><div class="sidebar-footer"><a href="../horarios/">Horarios FAB</a><a href="../resultados/">Resultados FEB/FAB</a><button id="logout" class="ghost-button">Cerrar sesión</button></div></aside><main class="app-main"><header class="app-header"><div><span class="eyebrow">GESTIÓN · CALENDARIO</span><h1 id="page-title">Partidos</h1></div><div class="user-chip"><span id="user-name"></span><span id="user-roles"></span></div></header><section id="matchPanel" class="data-panel" hidden><div class="section-heading"><div><span class="eyebrow">CALENDARIO</span><h2>Nuevo partido</h2></div></div><form id="matchForm"><div class="form-grid"><label class="field">Equipo<select id="teamSeason" required></select></label><label class="field">Fecha y hora<input id="matchDate" type="datetime-local" required></label><label class="field">Rival<input id="opponent" required></label><label class="field">Local / visitante<select id="home"><option value="true">Local</option><option value="false">Visitante</option></select></label><label class="field">Puntos local<input id="homeScore" type="number" min="0"></label><label class="field">Puntos visitante<input id="awayScore" type="number" min="0"></label><label class="field">Estado<select id="status"><option value="scheduled">Programado</option><option value="played">Jugado</option><option value="postponed">Aplazado</option><option value="cancelled">Cancelado</option></select></label><label class="field">Competición<input id="competition"></label><label class="field">Grupo<input id="group"></label><label class="field">Jornada<input id="round" type="number" min="1"></label><label class="field">Pabellón<input id="venue"></label><label class="field">Origen externo<input id="source" placeholder="FAB / FEB"></label><label class="field">ID partido externo<input id="externalId"></label><label class="field full">Notas<textarea id="notes"></textarea></label></div><div class="form-actions"><button class="primary" type="submit">Guardar partido</button></div><div id="formMessage"></div></form></section><section class="data-panel"><div class="section-heading"><div><span class="eyebrow">CALENDARIO</span><h2>Partidos registrados</h2></div><span id="count" class="status-pill"></span></div><div id="content">Cargando…</div></section></main></div><script type="module">import{requireContext,query,insert,update,remove,escapeHtml,formatDate,enableLogout,setHeader,canEditTeam,showMessage}from'./data.js';const c=await requireContext();setHeader(c,'Partidos');enableLogout();if(canEditTeam(c))matchPanel.hidden=false;let teams=[];async function loadTeams(){teams=await query('team_seasons','id,display_name,season_id');teamSeason.innerHTML=teams.map(t=>`<option value="${t.id}">${escapeHtml(t.display_name||t.id)}</option>`).join('')}matchForm.addEventListener('submit',async e=>{e.preventDefault();try{await insert('matches',{team_season_id:teamSeason.value,match_date:matchDate.value?new Date(matchDate.value).toISOString():null,opponent_name:opponent.value.trim(),is_home:home.value==='true',home_score:homeScore.value===''?null:Number(homeScore.value),away_score:awayScore.value===''?null:Number(awayScore.value),status:status.value,competition_name:competition.value.trim()||null,group_name:group.value.trim()||null,jornada:round.value?Number(round.value):null,venue_name:venue.value.trim()||null,external_source:source.value.trim()||null,external_match_id:externalId.value.trim()||null,notes:notes.value.trim()||null});showMessage(formMessage,'Partido guardado correctamente.','success');e.target.reset();await render()}catch(err){showMessage(formMessage,err.message,'error')}});async function render(){const rows=await query('matches','id,team_season_id,match_date,opponent_name,is_home,home_score,away_score,status,competition_name,jornada');rows.sort((a,b)=>new Date(a.match_date||0)-new Date(b.match_date||0));document.querySelector('#count').textContent=`${rows.length} partidos`;document.querySelector('#content').innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Equipo</th><th>Rival</th><th>Condición</th><th>Resultado</th><th>Estado</th><th>Competición</th>${canEditTeam(c)?'<th></th>':''}</tr></thead><tbody>${rows.map(r=>`<tr><td>${formatDate(r.match_date)}</td><td>${escapeHtml(teams.find(t=>t.id===r.team_season_id)?.display_name||'—')}</td><td><strong>${escapeHtml(r.opponent_name)}</strong></td><td>${r.is_home?'Local':'Visitante'}</td><td>${r.home_score==null||r.away_score==null?'—':`${r.home_score} - ${r.away_score}`}</td><td>${escapeHtml(r.status||'—')}</td><td>${escapeHtml(r.competition_name||'—')}</td>${canEditTeam(c)?`<td><button class="secondary" data-delete="${r.id}">Eliminar</button></td>`:''}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay partidos registrados todavía.</div>';document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar este partido?'))return;try{await remove('matches',b.dataset.delete);await render()}catch(err){alert(err.message)}})}await loadTeams();await render();</script></body></html>
