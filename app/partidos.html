<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADLSM · Partidos</title><link rel="icon" href="../assets/logos/ADLSM.jpg"><link rel="stylesheet" href="app.css"></head><body class="app-page"><div class="app-layout"><aside class="app-sidebar"><a class="app-brand" href="./"><img src="../assets/logos/ADLSM.jpg" alt="ADLSM"><span>ADLSM</span></a><nav><a href="./">Panel</a><a href="./equipos.html">Equipos</a><a href="./personas.html">Personas</a><a href="./temporadas.html">Temporadas</a><a class="active" href="./partidos.html">Partidos</a></nav><div class="sidebar-footer"><a href="../horarios/">Horarios FAB</a><a href="../resultados/">Resultados</a><button id="logout" class="ghost-button">Cerrar sesión</button></div></aside><main class="app-main"><header class="app-header"><div><span class="eyebrow">GESTIÓN</span><h1 id="page-title">Partidos</h1></div><div class="user-chip"><span id="user-name"></span><span id="user-roles"></span></div></header><section class="data-panel"><div class="section-heading"><span class="eyebrow">CALENDARIO</span><h2>Partidos registrados</h2></div><div id="content">Cargando…</div></section></main></div><script type="module">import{requireContext,query,escapeHtml,formatDate,enableLogout,setHeader}from'./data.js';const c=await requireContext();setHeader(c,'Partidos');enableLogout();const rows=await query('matches','id,team_season_id,match_date,opponent_name,is_home,home_score,away_score,status,competition_name');rows.sort((a,b)=>new Date(a.match_date||0)-new Date(b.match_date||0));document.querySelector('#content').innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Rival</th><th>Local</th><th>Resultado</th><th>Estado</th><th>Competición</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${formatDate(r.match_date)}</td><td><strong>${escapeHtml(r.opponent_name)}</strong></td><td>${r.is_home?'Sí':'No'}</td><td>${r.home_score==null||r.away_score==null?'—':`${r.home_score} - ${r.away_score}`}</td><td>${escapeHtml(r.status||'—')}</td><td>${escapeHtml(r.competition_name||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No hay partidos registrados todavía.</p>';</script></body></html>
