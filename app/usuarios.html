<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADLSM · Usuarios</title><link rel="icon" href="../assets/logos/ADLSM.jpg"><link rel="stylesheet" href="app.css"></head><body class="app-page"><div class="app-layout"><aside class="app-sidebar"><a class="app-brand" href="./"><img src="../assets/logos/ADLSM.jpg" alt="ADLSM"><span>ADLSM</span></a><nav><div class="nav-group">GESTIÓN</div><a href="./">Panel</a><a href="./equipos.html">Equipos</a><a href="./personas.html">Personas</a><a href="./temporadas.html">Temporadas</a><a href="./partidos.html">Partidos</a><a class="active" href="./usuarios.html">Usuarios</a></nav><div class="sidebar-footer"><a href="../horarios/">Horarios FAB</a><a href="../resultados/">Resultados FEB/FAB</a><button id="logout" class="ghost-button">Cerrar sesión</button></div></aside><main class="app-main"><header class="app-header"><div><span class="eyebrow">ADMINISTRACIÓN</span><h1 id="page-title">Usuarios</h1></div><div class="user-chip"><span id="user-name"></span><span id="user-roles"></span></div></header><section id="rolePanel" class="data-panel" hidden><div class="section-heading"><div><span class="eyebrow">PERMISOS</span><h2>Asignar rol</h2><p class="muted">Las cuentas se crean desde Supabase Auth. Aquí solo gestionamos sus permisos dentro de ADLSM.</p></div></div><form id="roleForm"><div class="form-grid"><label class="field">Usuario<select id="userSelect" required></select></label><label class="field">Rol<select id="role"><option>Coordinador</option><option>Responsable</option><option>Entrenador</option><option>Consulta</option></select></label></div><div class="form-actions"><button class="primary" type="submit">Asignar rol</button></div><div id="formMessage"></div></form></section><section class="data-panel"><div class="section-heading"><div><span class="eyebrow">CUENTAS</span><h2>Usuarios registrados</h2></div></div><div id="content">Cargando…</div></section></main></div><script type="module">import{requireContext,query,insert,remove,updateBy,escapeHtml,enableLogout,setHeader,canEditAll,showMessage}from'./data.js';const c=await requireContext();setHeader(c,'Usuarios');enableLogout();if(!canEditAll(c)){document.querySelector('#content').innerHTML='<div class="empty">La gestión de usuarios está reservada a Coordinación.</div>'}else{rolePanel.hidden=false;let users=[],roles=[];async function load(){[users,roles]=await Promise.all([query('user_profiles','user_id,person_id,display_name,is_active'),query('user_roles','id,user_id,role')]);userSelect.innerHTML=users.map(u=>`<option value="${u.user_id}">${escapeHtml(u.display_name||u.user_id)}</option>`).join('')}roleForm.onsubmit=async e=>{e.preventDefault();try{await insert('user_roles',{user_id:userSelect.value,role:role.value});showMessage(formMessage,'Rol asignado.','success');await render()}catch(err){showMessage(formMessage,err.message,'error')}};async function render(){await load();document.querySelector('#content').innerHTML=users.length?`<div class="table-wrap"><table><thead><tr><th>Usuario</th><th>Estado</th><th>Roles</th><th></th></tr></thead><tbody>${users.map(u=>{const rs=roles.filter(r=>r.user_id===u.user_id);return`<tr><td><strong>${escapeHtml(u.display_name||u.user_id)}</strong></td><td><span class="status-pill ${u.is_active?'active':''}">${u.is_active?'Activo':'Inactivo'}</span></td><td>${rs.length?rs.map(r=>escapeHtml(r.role)).join(' · '):'Sin rol'}</td><td><div class="inline-actions">${rs.map(r=>`<button class="secondary" data-role="${r.id}">Quitar ${escapeHtml(r.role)}</button>`).join('')}<button class="secondary" data-state="${u.is_active}" data-user="${u.user_id}">${u.is_active?'Desactivar':'Activar'}</button></div></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No hay usuarios registrados.</div>';document.querySelectorAll('[data-role]').forEach(b=>b.onclick=async()=>{try{await remove('user_roles',b.dataset.role);await render()}catch(err){alert(err.message)}});document.querySelectorAll('[data-user]').forEach(b=>b.onclick=async()=>{try{await updateBy('user_profiles','user_id',b.dataset.user,{is_active:b.dataset.state!=='true'});await render()}catch(err){alert(err.message)}})}render()}</script></body></html>
