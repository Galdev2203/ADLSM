<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADLSM · Plantillas</title><link rel="icon" href="../assets/logos/ADLSM.jpg"><link rel="stylesheet" href="app.css"></head><body class="app-page"><div class="app-layout"><aside class="app-sidebar"><a class="app-brand" href="./"><img src="../assets/logos/ADLSM.jpg" alt="ADLSM"><span>ADLSM</span></a><nav><div class="nav-group">GESTIÓN</div><a href="./">Panel</a><a href="./equipos.html">Equipos</a><a class="active" href="./plantillas.html">Plantillas</a><a href="./personas.html">Personas</a><a href="./temporadas.html">Temporadas</a><a href="./partidos.html">Partidos</a><a href="./usuarios.html">Usuarios</a><div class="nav-group">HERRAMIENTAS</div><a href="../horarios/">Horarios FAB</a><a href="../resultados/">Resultados FEB/FAB</a></nav><div class="sidebar-footer"><button id="logout" class="ghost-button">Cerrar sesión</button></div></aside><main class="app-main"><header class="app-header"><div><span class="eyebrow">GESTIÓN · PLANTILLAS</span><h1 id="page-title">Plantillas</h1></div><div class="user-chip"><span id="user-name"></span><span id="user-roles"></span></div></header><section class="data-panel"><div class="section-heading"><div><span class="eyebrow">EQUIPO</span><h2>Seleccionar equipo</h2></div></div><label class="field">Equipo dentro de temporada<select id="teamSelect"></select></label></section><section class="data-panel"><div class="section-heading"><div><span class="eyebrow">JUGADORES</span><h2>Plantilla de jugadores</h2></div></div><div id="playerForm" class="form-grid"><label class="field">Añadir jugador<select id="playerSelect"></select></label><label class="field">Dorsal<input id="shirtNumber" type="number" min="0"></label><label class="field"><span>&nbsp;</span><button id="addPlayer" class="primary" type="button">Añadir jugador</button></label></div><div id="playerMessage"></div><div id="players" class="table-wrap" style="margin-top:18px"></div></section><section id="coachesPanel" class="data-panel"><div class="section-heading"><div><span class="eyebrow">ENTRENADORES</span><h2>Cuerpo técnico</h2></div></div><div id="coachForm" class="form-grid"><label class="field">Añadir entrenador<select id="coachSelect"></select></label><label class="field">Rol<input id="coachRole" value="assistant" placeholder="head / assistant"></label><label class="field"><span>&nbsp;</span><button id="addCoach" class="primary" type="button">Añadir entrenador</button></label></div><div id="coachMessage"></div><div id="coaches" class="table-wrap" style="margin-top:18px"></div></section></main></div><script type="module">import{requireContext,query,insert,remove,escapeHtml,enableLogout,setHeader,canEditTeam,canEditAll,showMessage}from'./data.js';const c=await requireContext();setHeader(c,'Plantillas');enableLogout();if(!canEditTeam(c))playerForm.hidden=true;if(!canEditAll(c))coachForm.hidden=true;let teams=[],players=[],coaches=[];async function load(){[teams,players,coaches]=await Promise.all([query('team_seasons','id,display_name'),query('player_profiles','person_id,federation_license,position,shirt_number'),query('coach_profiles','person_id,federation_license,qualification')]);const people=await query('people','id,first_name,last_name,is_active');const names=new Map(people.map(p=>[p.id,`${p.first_name} ${p.last_name}`]));players=players.map(p=>({...p,name:names.get(p.person_id)||p.person_id}));coaches=coaches.map(p=>({...p,name:names.get(p.person_id)||p.person_id}));teamSelect.innerHTML=teams.map(t=>`<option value="${t.id}">${escapeHtml(t.display_name)}</option>`).join('');playerSelect.innerHTML=players.map(p=>`<option value="${p.person_id}">${escapeHtml(p.name)}</option>`).join('');coachSelect.innerHTML=coaches.map(p=>`<option value="${p.person_id}">${escapeHtml(p.name)}</option>`).join('')}async function render(){const teamId=teamSelect.value;const [tp,tc]=await Promise.all([query('team_players','id,team_season_id,player_id,is_primary,shirt_number,status,joined_at,left_at,notes').then(rows=>rows.filter(r=>r.team_season_id===teamId)),query('team_coaches','id,team_season_id,coach_id,role,is_primary,joined_at,left_at').then(rows=>rows.filter(r=>r.team_season_id===teamId))]);const playerMap=new Map(players.map(p=>[p.person_id,p]));document.querySelector('#players').innerHTML=tp.length?`<table><thead><tr><th>Jugador</th><th>Posición</th><th>Dorsal</th><th>Principal</th><th>Estado</th><th></th></tr></thead><tbody>${tp.map(r=>{const p=playerMap.get(r.player_id);return`<tr><td><strong>${escapeHtml(p?.name||r.player_id)}</strong></td><td>${escapeHtml(p?.position||'—')}</td><td>${r.shirt_number??p?.shirt_number??'—'}</td><td>${r.is_primary?'Sí':'No'}</td><td>${escapeHtml(r.status||'—')}</td><td>${canEditTeam(c)?`<button class="secondary" data-player-remove="${r.id}">Quitar</button>`:'—'}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No hay jugadores en este equipo.</div>';const coachMap=new Map(coaches.map(p=>[p.person_id,p]));document.querySelector('#coaches').innerHTML=tc.length?`<table><thead><tr><th>Entrenador</th><th>Rol</th><th>Principal</th><th></th></tr></thead><tbody>${tc.map(r=>`<tr><td><strong>${escapeHtml(coachMap.get(r.coach_id)?.name||r.coach_id)}</strong></td><td>${escapeHtml(r.role||'—')}</td><td>${r.is_primary?'Sí':'No'}</td><td>${canEditAll(c)?`<button class="secondary" data-coach-remove="${r.id}">Quitar</button>`:'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No hay entrenadores asignados.</div>';document.querySelectorAll('[data-player-remove]').forEach(b=>b.onclick=async()=>{try{await remove('team_players',b.dataset.playerRemove);await render()}catch(err){alert(err.message)}});document.querySelectorAll('[data-coach-remove]').forEach(b=>b.onclick=async()=>{try{await remove('team_coaches',b.dataset.coachRemove);await render()}catch(err){alert(err.message)}})}teamSelect.onchange=render;addPlayer.onclick=async()=>{try{await insert('team_players',{team_season_id:teamSelect.value,player_id:playerSelect.value,is_primary:true,shirt_number:shirtNumber.value?Number(shirtNumber.value):null,status:'active'});showMessage(playerMessage,'Jugador añadido.','success');await render()}catch(err){showMessage(playerMessage,err.message,'error')}};addCoach.onclick=async()=>{try{await insert('team_coaches',{team_season_id:teamSelect.value,coach_id:coachSelect.value,role:coachRole.value.trim()||'assistant',is_primary:false});showMessage(coachMessage,'Entrenador añadido.','success');await render()}catch(err){showMessage(coachMessage,err.message,'error')}};await load();await render();</script></body></html>
